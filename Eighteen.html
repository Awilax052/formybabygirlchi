<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eighteen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#5a2a45;--ivory:#fff0f5;--paper:#fffafb;--gold:#d4628f;--gold2:#f2b0c8;--rose:#e87aa0;--wine:#b02a63;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);overflow-x:hidden;min-height:100vh;
background:radial-gradient(ellipse at 50% 40%,#fffafb 0,rgba(255,250,251,0) 60%),radial-gradient(circle at 12% 8%,#ffd6e5 0,transparent 38%),radial-gradient(circle at 90% 92%,#f8d9f0 0,transparent 40%),var(--ivory)}
.frame{position:fixed;inset:14px;border:1px solid var(--gold2);pointer-events:none;z-index:4}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(212,98,143,.3)}
.stage{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 22px 40px;text-align:center}
.eyebrow{font:400 12px var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:0;animation:rise 1.4s ease both}
h1{margin:10px 0 0;font:500 clamp(34px,6.2vw,62px)/1.05 var(--serif);animation:rise 1.4s .15s ease both}
h1 em{font-style:italic;color:var(--wine)}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 0;width:min(300px,70vw)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(270deg,transparent,var(--gold))}
.rule i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.flowerWrap{position:relative;margin-top:6px}
.bigNum{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font:italic 400 min(46vh,400px)/1 var(--serif);color:rgba(212,98,143,.12);z-index:-1;user-select:none}
svg.flower{display:block;height:min(50vh,460px);max-width:90vw;width:auto;transform-origin:50% 100%;animation:sway 7s ease-in-out 4s infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.wash{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3s ease-out forwards;opacity:.75}
.ink{opacity:0;animation:fade 2s ease-out 1.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.line{margin:12px 0 0;font:italic 400 clamp(17px,2.6vw,21px) var(--serif);color:#9a5a78;opacity:0;animation:fade 1.4s 3s forwards}
.openBtn{margin-top:22px;cursor:pointer;font:400 13px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink);background:transparent;padding:16px 38px;border:1px solid var(--gold);position:relative;opacity:0;animation:fade 1.2s 3.6s forwards;transition:color .35s,background .35s}
.openBtn::before{content:"";position:absolute;inset:4px;border:1px solid rgba(212,98,143,.4)}
.openBtn:hover{background:var(--wine);color:#fff}
.drift{position:fixed;top:-24px;z-index:3;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx,0),108vh,0) rotate(var(--r,200deg))}}

.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(90,30,62,.5);backdrop-filter:blur(8px);opacity:0;transition:opacity .6s}
.overlay.show{display:flex}.overlay.in{opacity:1}
.scene{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;perspective:1000px}
.env{position:absolute;width:min(340px,80vw);aspect-ratio:3/2;transition:transform .9s cubic-bezier(.6,0,.4,1),opacity .7s;filter:drop-shadow(0 22px 30px rgba(0,0,0,.35))}
.env .back{position:absolute;inset:0;background:#f5d3df;border-radius:3px}
.env .flap{position:absolute;left:0;top:0;width:100%;height:58%;background:#f9e1ea;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .8s ease;z-index:4}
.env .L,.env .R,.env .B{position:absolute;inset:0;z-index:3}
.env .L{background:#f7d9e3;clip-path:polygon(0 0,52% 52%,0 100%)}
.env .R{background:#f7d9e3;clip-path:polygon(100% 0,48% 52%,100% 100%)}
.env .B{background:#fbe8ef;clip-path:polygon(0 100%,50% 48%,100% 100%)}
.env .seal{position:absolute;left:50%;top:41%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#e0608f,#b02a63 60%,#8a1f4a);box-shadow:0 3px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font:italic 500 21px var(--serif);color:rgba(255,235,240,.95);transition:opacity .3s}
.overlay.open .flap{transform:rotateX(180deg);z-index:1;background:#f0c9d8}
.overlay.open .seal{opacity:0}
.overlay.out .env{transform:translateY(52vh) scale(.92);opacity:0}
.paper{position:relative;width:min(600px,94vw);max-height:92vh;overflow:auto;background:var(--paper);padding:46px 44px 28px;box-shadow:0 30px 70px rgba(0,0,0,.45);opacity:0;transform:translateY(38vh) scale(.5);transition:transform 1s cubic-bezier(.2,1,.3,1),opacity .5s;pointer-events:none}
.overlay.out .paper{opacity:1;transform:none;pointer-events:auto}
.close{position:absolute;right:20px;top:18px;border:0;background:none;color:var(--gold);font:300 28px/1 var(--sans);cursor:pointer;z-index:3}
.close:hover{color:var(--wine)}
.mono{display:block;text-align:center;font:italic 500 40px/1 var(--serif);color:var(--wine)}
.paper h2{margin:6px 0 0;text-align:center;font:400 11px var(--sans);letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.when{text-align:center;font:italic 400 17px var(--serif);color:#b07a93;margin:8px 0 18px}
.dear{display:block;width:100%;border:0;background:none;outline:none;padding:4px 0;font:italic 500 clamp(26px,5vw,32px) var(--serif);color:var(--wine)}
.body{display:block;width:100%;min-height:300px;resize:none;border:0;outline:none;overflow:hidden;background:repeating-linear-gradient(transparent 0 35px,#f6dbe5 35px 36px);background-attachment:local;font:400 clamp(21px,4.4vw,25px)/36px var(--serif);color:#5a2a45;padding:0;margin-top:6px}
.dear::placeholder,.body::placeholder,.sign input::placeholder{color:#dfb3c6;font-style:italic}
.sign{display:flex;align-items:baseline;gap:10px;margin-top:14px;justify-content:flex-end}
.sign span{font:italic 400 20px var(--serif);color:#b07a93;white-space:nowrap}
.sign input{width:min(250px,60%);border:0;border-bottom:1px solid var(--gold2);background:none;outline:none;text-align:right;font:italic 500 26px var(--serif);color:var(--wine);min-width:0}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px auto 0;width:140px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--gold2)}
.orn i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.tools{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tools button{border:0;background:none;cursor:pointer;font:400 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);padding:8px 6px}
.tools button:hover{color:var(--wine)}
.next{text-align:center;margin:64px 0 8px;padding-top:26px}
.next p{margin:0 0 14px;font:italic 400 20px var(--serif);color:#b07a93}
.next button{cursor:pointer;font:400 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--wine);background:transparent;padding:14px 30px;border:1px solid var(--gold)}
.next button:hover{background:var(--wine);color:#fff}

.cakeScene{position:fixed;inset:0;z-index:70;display:none;overflow:hidden;color:var(--ink);opacity:0;transition:opacity .9s;
background:radial-gradient(ellipse at 50% 55%,#fffafb 0,rgba(255,250,251,0) 62%),radial-gradient(circle at 12% 8%,#ffd6e5 0,transparent 38%),radial-gradient(circle at 90% 92%,#f8d9f0 0,transparent 40%),var(--ivory)}
.cakeScene.show{display:block}.cakeScene.in{opacity:1}
.cakeScene::before{content:"";position:absolute;inset:14px;border:1px solid var(--gold2);pointer-events:none;z-index:4}
.stars i{position:absolute;border-radius:50%;background:#f2b0c8;opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.95}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fl{position:absolute;bottom:-30px;z-index:1;pointer-events:none;animation:flt linear forwards}
@keyframes flt{to{transform:translate(var(--dx,0),-112vh)}}
.cakeWrap{position:relative;z-index:2;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:18px 16px;text-align:center}
.cakeWrap>:first-child{margin-top:auto}.cakeWrap>:last-child{margin-bottom:auto}
.cakeTop{display:grid;place-items:center;min-height:clamp(120px,24vh,230px);width:100%}
.cakeTop>*{grid-area:1/1;transition:opacity .8s,transform .8s}
.wishSmall{margin:0;font:400 12px var(--sans);letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.wish h3{margin:8px 0 6px;font:italic 500 clamp(32px,7vw,58px)/1.1 var(--serif)}
.wishSub{margin:0;font:italic 400 clamp(17px,2.6vw,21px) var(--serif);color:#9a5a78}
.cakeScene.done .wish{opacity:0;transform:translateY(-14px);pointer-events:none}
.hbd{opacity:0;pointer-events:none}
.cakeScene.done .hbd{opacity:1}
.hbd .w{display:block;font:600 clamp(40px,11.5vw,98px)/1.02 var(--serif);letter-spacing:.07em;filter:drop-shadow(0 4px 14px rgba(201,139,148,.3))}
.hbd .w b{display:inline-block;font-weight:600;opacity:0;animation:lin .7s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes lin{from{opacity:0;transform:translateY(34px) scale(.5)}to{opacity:1;transform:none}}
.hbd .nm{display:block;margin-top:6px;font:italic 400 clamp(20px,3.4vw,28px) var(--serif);color:var(--wine);opacity:0;animation:lin .8s 1.6s forwards}
.cakeBox{position:relative;animation:cbob 4.5s ease-in-out infinite}
@keyframes cbob{50%{transform:translateY(-5px)}}
.cakeBox svg{display:block;height:min(44vh,400px);width:auto;max-width:86vw;overflow:visible;filter:drop-shadow(0 14px 26px rgba(176,42,99,.2))}
.glow{position:absolute;left:50%;top:21%;width:74%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,205,130,.45),transparent 68%);filter:blur(10px);transition:opacity 1.2s;animation:gl 1.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes gl{from{opacity:.7}to{opacity:1}}
.cakeBox.out .glow{opacity:0;animation:none}
.fw{transition:opacity .45s}.cakeBox.out .fw{opacity:0}
.lean{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(var(--lean,0deg)) scaleY(var(--sy,1))}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .22s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.93,1.09) rotate(2deg)}}
.smoke{fill:none;stroke:rgba(150,100,130,.55);stroke-width:2;stroke-linecap:round;opacity:0}
.cakeBox.out .smoke{animation:smk 2.6s ease-out forwards}
@keyframes smk{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.sp{transform-box:fill-box;transform-origin:center;animation:spk 2.6s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.meter{width:min(260px,70vw);height:4px;border-radius:4px;background:rgba(176,42,99,.12);overflow:hidden;margin-top:4px;transition:opacity .5s}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8a0bd,#b99be0)}
.cakeScene.done .meter{opacity:0}
.micMsg{margin:4px 0 0;min-height:26px;font:italic 400 clamp(16px,2.4vw,19px) var(--serif);color:#b07a93}
.cakeBtns{display:flex;gap:10px 14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.cbtn{cursor:pointer;background:transparent;border:1px solid var(--gold);color:var(--ink);padding:12px 24px;font:400 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;transition:background .3s,color .3s}
.cbtn:hover{background:var(--wine);color:#fff}
.cbtn[hidden]{display:none}
@media (max-width:520px){.paper{padding:40px 24px 22px}.frame{inset:8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.wash{stroke-dashoffset:0}.ink,.openBtn,.line{opacity:1}}
@media print{body{background:#fff}.stage,.frame,.drift,.tools,.close,.next,.cakeScene,.env{display:none!important}.overlay{position:static;display:block;background:none;backdrop-filter:none;opacity:1;padding:0}.paper{opacity:1;transform:none;box-shadow:none;max-height:none;overflow:visible;width:100%}}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<main class="stage">
  <p class="eyebrow">Happy Birthday</p>
  <h1>Welcome to your <em>eighteenth</em></h1>
  <div class="rule"><i></i></div>
  <div class="flowerWrap">
    <div class="bigNum" aria-hidden="true">18</div>
    <svg class="flower" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <linearGradient id="wc1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2d6"/><stop offset=".5" stop-color="#ffe0ea"/><stop offset="1" stop-color="#f2c4e0"/></linearGradient>
        <linearGradient id="wc2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c0e0"/><stop offset=".6" stop-color="#e8c6f0"/><stop offset="1" stop-color="#ffc9d9"/></linearGradient>
        <g id="bl"><g fill="#f7a8c4" stroke="#c2457a" stroke-width="1.5">
          <ellipse cx="0" cy="-20" rx="11" ry="20"/><ellipse cx="0" cy="-20" rx="11" ry="20" transform="rotate(72)"/><ellipse cx="0" cy="-20" rx="11" ry="20" transform="rotate(144)"/><ellipse cx="0" cy="-20" rx="11" ry="20" transform="rotate(216)"/><ellipse cx="0" cy="-20" rx="11" ry="20" transform="rotate(288)"/></g>
          <circle r="7" fill="#ffe3ec" stroke="#c2457a" stroke-width="1.5"/></g>
      </defs>
      <g fill="none" stroke-linecap="round" stroke-width="40">
        <path class="wash" pathLength="1" stroke="url(#wc1)" d="M90 140 Q200 110 310 150"/>
        <path class="wash" pathLength="1" stroke="url(#wc2)" style="animation-delay:.8s" d="M120 250 Q210 230 290 280"/>
      </g>
      <g class="ink">
        <path d="M200 478 C185 400 218 330 200 200" fill="none" stroke="#c2457a" stroke-width="3" stroke-linecap="round"/>
        <path d="M197 400 C150 395 125 365 120 345 C160 345 190 365 197 400Z" fill="#f7c6dc" stroke="#c2457a" stroke-width="1.5"/>
        <path d="M200 350 C245 345 270 315 275 295 C235 295 207 315 200 350Z" fill="#f7c6dc" stroke="#c2457a" stroke-width="1.5"/>
        <path d="M201 290 C160 285 140 260 135 245 C170 245 196 262 201 290Z" fill="#f7c6dc" stroke="#c2457a" stroke-width="1.5"/>
        <use href="#bl" transform="translate(200 150) scale(1.5)"/>
        <use href="#bl" transform="translate(125 215) scale(1)"/>
        <use href="#bl" transform="translate(275 235) scale(1.1)"/>
        <use href="#bl" transform="translate(150 105) scale(.7)"/>
      </g>
    </svg>
  </div>
  <p class="line">A new chapter, beautifully yours.</p>
  <button class="openBtn" id="openBtn" type="button">Open your letter</button>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Birthday letter">
  <div class="scene">
    <div class="env" id="env"><div class="back"></div><div class="flap"></div><div class="seal">18</div><div class="L"></div><div class="R"></div><div class="B"></div></div>
    <div class="paper" id="paper">
      <button class="close" id="close" type="button" aria-label="Close">×</button>
      <span class="mono">18</span>
      <h2>Happy Birthday</h2>
      <div class="when" id="when"></div>
      <input class="dear" id="dear" placeholder="Dear …," autocomplete="off" value="Hi ganda mo talga chi,">
      <textarea class="body" id="body" placeholder="Write your message here…" spellcheck="false">Happy 18th birthday to my oneandonly bebekeyks, Chii! Ang cute lang na sa first birthday mo na mag 18, nakilala mo na ako. Hehe. Virtual gift lang muna ’to kasi hindi pa tayo physically magkasama ngayon, pero soon, real one na! HBD once again , Chi  I just want you to know how deeply happy and grateful I am that I was able to be a part of your 18th birthday. Turning 18 is such a huge milestone, and I’m so so so glad I’m here to share this moment with you pu 

Thank you so much for everything for simply being in my life, for talking to me, and for sharing your days with me. I trullyyyy truly appreciate you more than words wehhheheez. Every single conversation we had, every mga kulitan natin, and every moment we spend tgt means a lot to me kahit month palang tayo.

Even though we are still in the talking stage and figuring things out, I really hope we can add so many more months and years to come with us and more memories. I want to be there w u sa future mo, to watch how you grow, to celebrate more of your birthdays to come, and to create countless more memories with you.

Enjoy your special day to the fullest, pretty girykohhhhh Mag-eat ka ng marami, and always remember how much you are appreciated and cherished. Happy 18th birthday again, Chi maycutieepatotiee</textarea>
      <div class="sign"><span>With love,</span><input id="from" placeholder="Jampotttt" autocomplete="off"></div>
      <div class="orn"><i></i></div>
      <div class="tools"><button type="button" id="sparkle">Celebrate</button><button type="button" id="print">Print / Save PDF</button></div>
      <div class="next"><p>One more thing…</p><button type="button" id="nextBtn">Continue ↓</button></div>
    </div>
  </div>
</div>

<div class="cakeScene" id="cakeScene" role="dialog" aria-modal="true" aria-label="Birthday cake">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cakeWrap">
    <div class="cakeTop">
      <div class="wish"><p class="wishSmall">One last thing</p><h3>Make a wish…</h3><p class="wishSub">then blow out the candles</p></div>
      <div class="hbd" id="hbd" aria-live="polite"></div>
    </div>
    <div class="cakeBox" id="cakeBox"><div class="glow"></div><svg id="cakeSvg" viewBox="0 0 400 420" aria-hidden="true"></svg></div>
    <div class="meter"><i id="meterFill"></i></div>
    <p class="micMsg" id="micMsg"></p>
    <div class="cakeBtns">
      <button class="cbtn" id="blowBtn" type="button">Tap to blow</button>
      <button class="cbtn" id="relight" type="button" hidden>Light the candles again</button>
      <button class="cbtn" id="soundBtn" type="button">Sound: on</button>
      <button class="cbtn" id="cakeBack" type="button">Back to letter</button>
    </div>
  </div>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var TONES=['#f2b0c8','#d4628f','#ffc9d9','#e87aa0','#ffe3ec','#f7c6dc'];
function drift(kind){
  var e=document.createElement('div');e.className='drift';
  e.style.left=(Math.random()*window.innerWidth)+'px';
  var dur=6+Math.random()*6;e.style.animationDuration=dur+'s';
  e.style.setProperty('--dx',((Math.random()-.5)*140)+'px');
  e.style.setProperty('--r',((Math.random()-.5)*360)+'deg');
  if(kind==='petal'){var s=9+Math.random()*8;e.style.width=s+'px';e.style.height=s*1.35+'px';e.style.background='linear-gradient(135deg,#ffd4e2,#e886a8)';e.style.borderRadius='85% 0 85% 0';e.style.opacity=.75}
  else{var d=3+Math.random()*4;e.style.width=d+'px';e.style.height=d+'px';e.style.borderRadius='50%';e.style.background=TONES[Math.floor(Math.random()*3)];e.style.opacity=.85;e.style.boxShadow='0 0 6px rgba(242,176,200,.9)'}
  document.body.appendChild(e);setTimeout(function(){e.remove()},dur*1000+100);
}
function shower(n){for(var i=0;i<n;i++)(function(i){setTimeout(function(){drift(i%3===0?'petal':'dust')},i*35)})(i)}
setInterval(function(){if(!document.hidden)drift(Math.random()>.6?'petal':'dust')},1100);
setTimeout(function(){shower(26)},1200);

var ov=$('overlay'),timers=[],cake=$('cakeScene');
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function openLetter(){
  ov.className='overlay show';void ov.offsetWidth;ov.classList.add('in');
  grow();later(grow,300);later(grow,1700);
  later(function(){ov.classList.add('open')},600);
  later(function(){ov.classList.add('out');shower(40)},1650);
}
function closeLetter(){timers.forEach(clearTimeout);timers=[];ov.classList.remove('in');setTimeout(function(){ov.className='overlay'},600)}
$('openBtn').addEventListener('click',openLetter);
$('close').addEventListener('click',closeLetter);
ov.addEventListener('click',function(e){if(e.target===ov||e.target.className==='scene')closeLetter()});
$('sparkle').addEventListener('click',function(){shower(60)});
$('print').addEventListener('click',function(){window.print()});
$('when').textContent=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});

var dear=$('dear'),body=$('body'),from=$('from');
function grow(){body.style.height='auto';body.style.height=Math.max(300,body.scrollHeight)+'px'}
function save(){try{localStorage.setItem('bday18-letter-v3',JSON.stringify({d:dear.value,b:body.value,f:from.value}))}catch(e){}}

var MEL=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];

  if(!ac)return;stopTune();var t=ac.currentTime+.5,beat=.46;

/* ---- fireworks ---- */
var fx=$('fx'),g=fx.getContext('2d'),W=0,H=0,parts=[],rockets=[],fxOn=false,raf=0,lastL=0,gap=0;
var HUES=[[335,85,62],[320,75,64],[350,85,66],[300,65,68],[42,80,52],[345,85,70]];
function fxSize(){var d=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;fx.width=W*d;fx.height=H*d;g.setTransform(d,0,0,d,0,0)}
function launch(){var ty=H*(.1+Math.random()*.34),gr=.12;rockets.push({x:W*(.12+Math.random()*.76),y:H+8,vx:(Math.random()-.5)*1.1,vy:-Math.sqrt(2*gr*(H-ty)),grav:gr})}
function explode(x,y){
  var c=HUES[Math.floor(Math.random()*HUES.length)],n,i,a,sp,kind=Math.random();boom();
  var sc=Math.max(.7,Math.min(1.25,H/760));
  if(kind<.28){n=70;for(i=0;i<n;i++){var t=i/n*Math.PI*2,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));parts.push({x:x,y:y,vx:hx*.2*sc,vy:hy*.2*sc,life:1,decay:.0085,h:c[0],s:c[1],l:c[2],size:2})}}
  else{n=95;for(i=0;i<n;i++){a=Math.PI*2*i/n+Math.random()*.1;sp=(kind<.65?(3.4+Math.random()*.5):(.8+Math.random()*4.4))*sc;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.009+Math.random()*.01,h:c[0]+(Math.random()-.5)*16,s:c[1],l:c[2],size:2})}}
  if(parts.length>1800)parts.splice(0,parts.length-1800);
}
function fxLoop(ts){
  raf=requestAnimationFrame(fxLoop);
  g.globalCompositeOperation='destination-out';g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';
  if(fxOn&&ts-lastL>gap){launch();lastL=ts;gap=450+Math.random()*650}
  var i;
  for(i=rockets.length-1;i>=0;i--){var r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy+=r.grav;
    parts.push({x:r.x,y:r.y,vx:(Math.random()-.5)*.4,vy:.4,life:.7,decay:.06,h:335,s:75,l:60,size:1.2});
    g.fillStyle='rgba(212,98,143,.95)';g.beginPath();g.arc(r.x,r.y,2,0,6.3);g.fill();
    if(r.vy>=-.6){explode(r.x,r.y);rockets.splice(i,1)}}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.vx*=.985;p.vy=p.vy*.985+.045;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0){parts.splice(i,1);continue}
    g.fillStyle='hsla('+p.h+','+p.s+'%,'+p.l+'%,'+p.life+')';g.beginPath();g.arc(p.x,p.y,p.size*p.life+.4,0,6.3);g.fill()}

}
function startFX(){fxSize();fxOn=true;gap=0;lastL=0;launch();setTimeout(launch,300);setTimeout(launch,650);if(!raf)raf=requestAnimationFrame(fxLoop)}
function stopFX(hard){fxOn=false;if(hard){rockets=[];parts=[];if(raf){cancelAnimationFrame(raf);raf=0}g.clearRect(0,0,W,H)}}
window.addEventListener('resize',function(){if(cake.classList.contains('show'))fxSize()});

/* ---- mic ---- */
function micMsg(t){$('micMsg').textContent=t}
function stopMic(){listening=false;if(stream){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}stream=null}
  cakeSvg.style.removeProperty('--lean');cakeSvg.style.removeProperty('--sy');$('meterFill').style.width='0%'}
function startMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!getAC()){micMsg('No microphone here — just tap the button below.');return}
  micMsg('Allow the microphone, then blow gently at your screen');
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
    if(!cake.classList.contains('show')||blown){st.getTracks().forEach(function(t){t.stop()});return}
    stream=st;var src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=1024;src.connect(an);
    tbuf=new Float32Array(an.fftSize);listening=true;base=0;frames=0;blowT=0;lastT=performance.now();
    micMsg('Listening… take a breath and blow on the candles');micTick();
  }).catch(function(){micMsg('Microphone is off — no worries, tap the button below to blow.')});
}
function micTick(){
  if(!listening)return;requestAnimationFrame(micTick);
  an.getFloatTimeDomainData(tbuf);var sum=0,i;for(i=0;i<tbuf.length;i++)sum+=tbuf[i]*tbuf[i];
  var rms=Math.sqrt(sum/tbuf.length),now=performance.now(),dt=Math.min(.1,(now-lastT)/1000);lastT=now;frames++;
  if(frames<30){base=Math.max(base,rms);return}
  var thr=Math.max(base*3,.07),lvl=Math.min(1,rms/(thr*1.5));
  $('meterFill').style.width=(lvl*100)+'%';cakeSvg.style.setProperty('--lean',(lvl*16)+'deg');cakeSvg.style.setProperty('--sy',(1-lvl*.25));
  if(rms>thr)blowT+=dt;else blowT=Math.max(0,blowT-dt*1.5);
  if(blowT>.4)blowOut();
}

/* ---- blow out ---- */
function buildHBD(){
  var cols=['#e0698a','#c45fb0','#d4628f'],idx=0,html='';
  ['HAPPY','BIRTHDAY'].forEach(function(w){html+='<span class="w">';
    w.split('').forEach(function(ch){html+='<b style="color:'+cols[idx%3]+';animation-delay:'+(.25+idx*.07)+'s">'+ch+'</b>';idx++});html+='</span>'});
  html+='<span class="nm">Chi, you’re eighteen</span>';$('hbd').innerHTML=html;
}
function blowOut(){
  if(blown)return;blown=true;stopMic();cakeBox.classList.add('out');cake.classList.add('done');buildHBD();
  $('blowBtn').hidden=true;$('relight').hidden=false;micMsg('');getAC();playTune();setTimeout(startFX,500);
}
function relight(){blown=false;stopFX(true);stopTune();cakeBox.classList.remove('out');cake.classList.remove('done');$('hbd').innerHTML='';$('blowBtn').hidden=false;$('relight').hidden=true;startMic()}
function openCake(){
  if(!cakeBuilt){buildCake();cakeBuilt=true}
  getAC();blown=false;cakeBox.classList.remove('out');cake.classList.remove('done');$('hbd').innerHTML='';
  $('blowBtn').hidden=false;$('relight').hidden=true;cake.classList.add('show');void cake.offsetWidth;cake.classList.add('in');
  fxSize();heartTimer=setInterval(function(){if(!document.hidden)floatHeart()},800);startMic();
}
function closeCake(){
  stopMic();stopTune();stopFX(true);blown=false;clearInterval(heartTimer);heartTimer=null;
  cake.classList.remove('in');setTimeout(function(){cake.classList.remove('show');cake.classList.remove('done')},800);
}
$('nextBtn').addEventListener('click',openCake);
$('blowBtn').addEventListener('click',blowOut);
$('relight').addEventListener('click',relight);
$('cakeBack').addEventListener('click',closeCake);
$('soundBtn').addEventListener('click',function(){soundOn=!soundOn;this.textContent='Sound: '+(soundOn?'on':'off');if(master)master.gain.value=soundOn?1:0});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(cake.classList.contains('show'))closeCake();else if(ov.classList.contains('show'))closeLetter();
});
